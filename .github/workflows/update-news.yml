name: Update hydrogen news

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - 'package*.json'
      - '.github/workflows/update-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hydrogen-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect news and build the site
        run: npm run build
      - name: Save the 30-day archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Update hydrogen news archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
